name: Bazel Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


env:
  HTTP_PROXY: ${{ vars.HTTP_PROXY }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
  NO_PROXY: '127.0.0.1,localhost,172.18.0.0/16,192.168.0.0/8,*.kekxv.com'
  
jobs:
  build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, windows-latest]
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Bazel(NO WINDOWS)
        uses: bazel-contrib/setup-bazel@0.15.0
        if: ${{matrix.os != 'windows-latest'}}
        with:
          token: ${{ secrets.GH_TOKEN }}
          bazelisk-version: 1.x
          # Avoid downloading Bazel every time.
          bazelisk-cache: false
          # Store build cache per workflow.
          #disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: false
          bazelrc: |
            build --cxxopt='-std=c++17'
            #build --@boost.mysql//:ssl=boringssl
            build --@boost.asio//:ssl=boringssl
      - name: Install Bazel(WINDOWS)
        if: ${{matrix.os == 'windows-latest'}}
        uses: bazel-contrib/setup-bazel@0.15.0
        with: 
          token: ${{ secrets.GH_TOKEN }}
          bazelisk-version: 1.x
          bazelisk-cache: false
          repository-cache: false
          bazelrc: |
            build --cxxopt='/std:c++17'
            build --cxxopt='/utf-8'
            build --cxxopt='/wd5031'
            build --features=static_link_msvcrt
            #build --@boost.mysql//:ssl=boringssl
            build --@boost.asio//:ssl=boringssl

      - name: Bazel Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          bazel test //framework/... --test_output=errors --test_verbose_timeout_warnings 2>&1 | tee ci-test.log
      - name: HTTP concurrency benchmark smoke test
        id: concurrency_benchmark
        shell: bash
        run: |
          set -o pipefail
          bazel run //framework/tests:concurrency_benchmark -- \
            --server-threads 2 --concurrency 8 --requests 80 --warmup 8 \
            2>&1 | tee ci-concurrency-benchmark.log
      - name: Publish test and benchmark summary
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ steps.test.outcome }}
          BENCHMARK_RESULT: ${{ steps.concurrency_benchmark.outcome }}
        run: |
          summary_file="${GITHUB_STEP_SUMMARY:-}"
          if [ -n "$summary_file" ]; then
            {
              echo "## khttpd framework tests (${{ matrix.os }})"
              echo
              echo "| Stage | Result |"
              echo "| --- | --- |"
              echo "| Test | ${TEST_RESULT} |"
              echo "| Benchmark | ${BENCHMARK_RESULT} |"
              echo
              echo '```text'
              sed -n '/khttpd HTTP 并发基准测试/,$p' ci-concurrency-benchmark.log 2>/dev/null || true
              echo '```'
            } >> "$summary_file"
          else
            echo "khttpd test: ${TEST_RESULT}"
            echo "khttpd concurrency benchmark: ${BENCHMARK_RESULT}"
            sed -n '/khttpd HTTP 并发基准测试/,$p' ci-concurrency-benchmark.log 2>/dev/null || true
          fi
  example:
    needs: build
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, windows-latest]
    name: Build example
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Bazel(NO WINDOWS)
        uses: bazel-contrib/setup-bazel@0.15.0
        if: ${{matrix.os != 'windows-latest'}}
        with:
          token: ${{ secrets.GH_TOKEN }}
          bazelisk-version: 1.x
          bazelisk-cache: false
          repository-cache: false
          bazelrc: |
            build --cxxopt='-std=c++17'
            #build --@boost.mysql//:ssl=boringssl
            build --@boost.asio//:ssl=boringssl
      - name: Install Bazel(WINDOWS)
        if: ${{matrix.os == 'windows-latest'}}
        uses: bazel-contrib/setup-bazel@0.15.0
        with: 
          token: ${{ secrets.GH_TOKEN }}
          bazelisk-version: 1.x
          bazelisk-cache: false
          repository-cache: false
          bazelrc: |
            build --cxxopt='/std:c++17'
            build --cxxopt='/utf-8'
            build --cxxopt='/wd5031'
            build --cxxopt='/wd4668'
            build --cxxopt='/wd4820'
            #build --@boost.mysql//:ssl=boringssl
            build --@boost.asio//:ssl=boringssl
      - name: Bazel Build example
        run: |
          cp .bazelrc ./example
          cd example
          bazel build app
          cd ..
